[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raksa-siem-sdk"
version = "0.3.0"
description = "Zero-dependency Python SDK for Raksa SIEM log normalization, correlation, hash-chained ledger verification, and mTLS/RBAC HTTP client."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "luminariadev", email = "rizkianuari83@gmail.com" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luminariadev/raksa-siem"
Repository = "https://github.com/luminariadev/raksa-siem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
